<div class="list-page">
  <header class="page-header">
    <div>
      <span>Admin resource</span>
      <h2>{{ config().title }}</h2>
      <p>{{ config().subtitle }}</p>
    </div>

    <button type="button" (click)="loadData()">Refresh</button>
  </header>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

  <section class="table-card">
    <div class="table-meta">
      <strong>{{ total() }}</strong>
      <span>records</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th *ngFor="let column of config().columns">{{ column.label }}</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of items()">
            <td *ngFor="let column of config().columns">
              <span [class.status-pill]="column.type === 'status'">
                {{ formatValue(getValue(item, column.key), column) }}
              </span>
            </td>

            <td>
              <a *ngIf="detailLink(item) as link" [routerLink]="link">Open</a>
              <span *ngIf="!detailLink(item)" class="muted">-</span>
            </td>
          </tr>

          <tr *ngIf="!isLoading() && items().length === 0">
            <td [attr.colspan]="config().columns.length + 1" class="empty">
              No records found.
            </td>
          </tr>

          <tr *ngIf="isLoading()">
            <td [attr.colspan]="config().columns.length + 1" class="empty">
              Loading...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
