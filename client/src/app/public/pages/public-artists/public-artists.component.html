<div class="loading-state" *ngIf="isLoading()">Loading...</div>
<div class="error-state" *ngIf="errorMessage()">{{ errorMessage() }}</div>

<section class="artists" *ngIf="!isLoading()">
  <header>
    <p class="eyebrow">Artists</p>
    <h1>Faces</h1>
  </header>

  <div class="artist-grid">
    <a *ngFor="let artist of artists()" [routerLink]="['/umetnici', artist.slug]">
      <img *ngIf="image(artist)" [src]="image(artist)" [alt]="artist.displayName || artist.name">
      <span *ngIf="!image(artist)">{{ (artist.displayName || artist.name || 'M').slice(0, 1) }}</span>
      <strong>{{ artist.displayName || artist.name }}</strong>
    </a>
  </div>
</section>
