<div class="loading-state" *ngIf="isLoading()">Ucitavanje umetnika...</div>
<div class="error-state" *ngIf="errorMessage()">{{ errorMessage() }}</div>

<section class="artists" *ngIf="!isLoading()">
  <header>
    <p class="eyebrow">Ansambl</p>
    <h1>Umetnici</h1>
    <p>Izvodjaci, autori i saradnici koji oblikuju repertoar Madlenianuma.</p>
  </header>

  <div class="empty-state" *ngIf="artists().length === 0">Umetnici jos nisu objavljeni.</div>

  <div class="artist-grid" *ngIf="artists().length > 0">
    <a *ngFor="let artist of artists(); let index = index" [routerLink]="['/umetnici', artist.slug]">
      <img [src]="image(artist, index)" [alt]="name(artist)" />
      <div>
        <span>{{ professions(artist) }}</span>
        <strong>{{ name(artist) }}</strong>
      </div>
    </a>
  </div>
</section>
