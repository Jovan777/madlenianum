<div class="home-loading" *ngIf="loading()" role="status" aria-live="polite">
  <span>Učitavanje programa...</span>
</div>

<section class="home-error" *ngIf="!loading() && error()" role="alert">
  <h1>Početna strana nije učitana</h1>
  <p>{{ error() }}</p>
  <button type="button" (click)="load()">Pokušaj ponovo</button>
</section>

<main class="home" *ngIf="!loading() && !error() && config() as homeConfig">
  <app-public-hero-slider
    *ngIf="homeConfig.hero.enabled"
    [slides]="slides()"
    [fallbackProduction]="repertoireProductions()[0] || featuredProductions()[0] || null"
  />

  <app-public-upcoming-events
    *ngIf="homeConfig.upcomingEvents.enabled"
    [events]="events()"
    [heading]="homeConfig.upcomingEvents.heading || 'Predstojeći događaji'"
  />

  <app-public-repertoire-section
    *ngIf="homeConfig.repertoireProductions.enabled"
    [productions]="repertoireProductions()"
    [heading]="homeConfig.repertoireProductions.heading || 'Šta je na repertoaru'"
  />

  <app-public-featured-section
    *ngIf="homeConfig.featuredProductions.enabled"
    [productions]="featuredProductions()"
    [heading]="homeConfig.featuredProductions.heading || 'Ne propustite'"
  />

  <app-public-news-section
    *ngIf="homeConfig.featuredNews.enabled"
    [items]="news()"
    [heading]="homeConfig.featuredNews.heading || 'Iza kulisa'"
  />

  <app-public-institutional-teaser
    *ngIf="homeConfig.institutionalTeaser.enabled"
    [teaser]="homeConfig.institutionalTeaser"
  />

  <app-public-cta-cards
    [cards]="homeConfig.ctaCards"
    [heading]="homeConfig.ctaCardsHeading || 'Partnerstvo'"
  />
</main>
