<footer class="site-footer">
  <div class="footer-inner" data-motion="up">
    <div class="footer-groups" *ngIf="navigationGroups().length">
      <nav *ngFor="let group of navigationGroups()" [attr.aria-label]="group.title">
        <h2>{{ group.title }}</h2>
        <ng-container *ngFor="let link of group.links">
          <a *ngIf="isExternal(link.url); else internalNavigation" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
          <ng-template #internalNavigation><a [routerLink]="internalPath(link.url)">{{ link.label }}</a></ng-template>
        </ng-container>
      </nav>
    </div>

    <div class="footer-brand">
      <a [routerLink]="locale.isEnglish() ? '/en' : '/'" [attr.aria-label]="i18n.t('footer.homeLabel')"><img [src]="logo()" [alt]="settings()?.siteName || 'Madlenianum'" /></a>
      <p class="copyright">© {{ currentYear }} {{ settings()?.siteName || 'Madlenianum' }}</p>
      <p *ngIf="settings()?.shortDescription">{{ settings()?.shortDescription }}</p>
      <address *ngIf="settings()?.contact?.address">{{ settings()?.contact?.address }}</address>
      <div class="socials" *ngIf="socialLinks().length">
        <a *ngFor="let link of socialLinks()" [href]="link.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label || link.platform">{{ socialShort(link) }}</a>
      </div>
    </div>
  </div>

  <div class="partner-row" *ngIf="partners().length" data-motion="fade">
    <ng-container *ngFor="let partner of partners()">
      <a *ngIf="partner.url; else partnerOnly" [href]="partner.url" target="_blank" rel="noopener noreferrer"><img [src]="media.resolve(partner.media)" [alt]="partner.label || 'Partner'" loading="lazy" /></a>
      <ng-template #partnerOnly><img [src]="media.resolve(partner.media)" [alt]="partner.label || 'Partner'" loading="lazy" /></ng-template>
    </ng-container>
  </div>

  <nav class="legal" *ngIf="legalLinks().length" aria-label="Pravni linkovi">
    <ng-container *ngFor="let link of legalLinks()">
      <a *ngIf="isExternal(link.url); else internalLegal" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
      <ng-template #internalLegal><a [routerLink]="internalPath(link.url)">{{ link.label }}</a></ng-template>
    </ng-container>
  </nav>
</footer>
