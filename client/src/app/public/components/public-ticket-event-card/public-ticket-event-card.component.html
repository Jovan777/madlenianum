<article class="event-card">
  <div class="poster">
    <img [src]="imageUrl()" [alt]="productionTitle()" />
  </div>

  <div class="event-copy">
    <div class="date-line">
      <span>{{ eventDay() }}</span>
      <i aria-hidden="true"></i>
      <span>{{ eventTime() }}</span>
    </div>

    <h2>{{ productionTitle() }}</h2>

    <div class="meta-line">
      <span>{{ productionType() }}</span>
      <span>{{ venueName() }}</span>
      <span *ngIf="event.isPremiere || event.badge" class="premiere">
        {{ event.badge || ('production.premiere' | publicTranslate) }}
      </span>
    </div>
  </div>
</article>
