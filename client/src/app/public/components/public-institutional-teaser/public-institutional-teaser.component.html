<section class="institutional-section" data-motion="up">
  <h2>{{ teaser().heading || 'Madlenianum' }}</h2>
  <div class="institutional-layout">
    <div class="copy" data-motion="left">
      <div class="rich-text" [innerHTML]="teaser().text"></div>
      <a [routerLink]="destination()">▣ {{ teaser().ctaLabel || 'Naša priča' }}</a>
    </div>
    <div class="image-wrap" data-motion="right" data-motion-card>
      <img *ngIf="media.resolve(teaser().image)" [src]="media.resolve(teaser().image)" alt="Opera i teatar Madlenianum" loading="lazy" />
      <div *ngIf="!media.resolve(teaser().image)" class="image-fallback" aria-hidden="true"></div>
    </div>
  </div>
</section>
