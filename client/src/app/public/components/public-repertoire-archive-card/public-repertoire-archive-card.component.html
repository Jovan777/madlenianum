<article>
  <a class="poster" [routerLink]="locale.productionPath(production().slug)" [attr.aria-label]="i18n.t('repertoire.details') + ': ' + production().title">
    <img [src]="image()" [alt]="production().title" loading="lazy" />
  </a>
  <h2><a [routerLink]="locale.productionPath(production().slug)">{{ production().title }}</a></h2>
</article>
