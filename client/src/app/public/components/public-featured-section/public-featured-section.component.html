<section class="featured-section" *ngIf="productions().length" data-motion="up">
  <header>
    <h2>{{ heading() || i18n.t('home.featured') }}</h2>
  </header>

  <div class="feature-layout" data-motion-stagger>
    <article class="feature-card primary" *ngIf="productions()[0] as production" data-motion-item data-motion-card>
      <img *ngIf="image(production)" [src]="image(production)" [alt]="production.title" loading="lazy" />
      <div class="shade"></div>
      <div class="copy">
        <h3>{{ production.title }}</h3>
        <p>{{ production.shortDescription || production.subtitle }}</p>
        <div class="actions">
          <a [routerLink]="[locale.equivalentPath('/predstave', locale.current()), production.slug]">ⓘ {{ i18n.t('common.learnMore') }}</a>
          <button *ngIf="trailer(production) as video" type="button" (click)="activeVideo.set(video)">▷ {{ i18n.t('common.watchTrailer') }}</button>
        </div>
      </div>
    </article>

    <div class="secondary-stack" *ngIf="productions().length > 1">
      <article class="feature-card secondary" *ngFor="let production of productions().slice(1, 3)" data-motion-item data-motion-card>
        <img *ngIf="image(production)" [src]="image(production)" [alt]="production.title" loading="lazy" />
        <div class="shade"></div>
        <div class="copy">
          <h3>{{ production.title }}</h3>
          <p>{{ production.shortDescription || production.subtitle }}</p>
          <div class="actions">
            <a [routerLink]="[locale.equivalentPath('/predstave', locale.current()), production.slug]">ⓘ {{ i18n.t('common.learnMore') }}</a>
            <button *ngIf="trailer(production) as video" type="button" (click)="activeVideo.set(video)" [attr.aria-label]="i18n.t('common.watchTrailer') + ': ' + production.title">▷</button>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>

<app-public-video-modal *ngIf="activeVideo() as video" [video]="video" (closed)="activeVideo.set(null)" />
