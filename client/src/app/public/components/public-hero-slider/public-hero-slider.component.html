<section class="hero" tabindex="0" aria-roledescription="carousel" [attr.aria-label]="'Izdvojeno: ' + title()">
  <img
    *ngIf="imageUrl()"
    class="hero-image"
    [src]="imageUrl()"
    [alt]="imageAlt()"
    fetchpriority="high"
    (error)="imageFailed.set(true)"
  />
  <div class="hero-fallback" *ngIf="!imageUrl()" aria-hidden="true"></div>
  <div class="hero-shade" aria-hidden="true"></div>

  <div class="hero-content">
    <div class="meta-row">
      <span>{{ display.productionType(production()?.type) }}</span>
      <ng-container *ngIf="event() as linkedEvent">
        <span>{{ display.dayMonth(linkedEvent.startsAt) }}</span>
        <span>{{ display.time(linkedEvent.startsAt) }}</span>
        <strong *ngIf="linkedEvent.isPremiere || linkedEvent.badge === 'Premijera'">Premijera</strong>
      </ng-container>
    </div>

    <h1>{{ title() }}</h1>
    <p>{{ description() }}</p>

    <div class="hero-actions">
      <a *ngIf="production()?.slug" class="outline-action" [routerLink]="['/predstave', production()?.slug]">
        <span aria-hidden="true">ⓘ</span> Saznaj više
      </a>
      <a *ngIf="sale()?.canPurchase && eventId()" class="ticket-action" [routerLink]="['/kupovina', eventId()]">
        Kupi karte
      </a>
      <span class="sale-status" *ngIf="sale() && !sale()?.canPurchase">{{ sale()?.label }}</span>
    </div>
  </div>

  <div class="slider-controls" *ngIf="slides().length > 1">
    <button type="button" (click)="previous()" aria-label="Prethodni slajd">‹</button>
    <div class="indicators" role="tablist" aria-label="Izbor slajda">
      <button
        *ngFor="let slide of slides(); let index = index"
        type="button"
        role="tab"
        [class.active]="index === activeIndex()"
        [attr.aria-selected]="index === activeIndex()"
        [attr.aria-label]="'Prikaži slajd ' + (index + 1)"
        (click)="setSlide(index)"
      ></button>
    </div>
    <button type="button" (click)="next()" aria-label="Sledeći slajd">›</button>
  </div>
</section>
