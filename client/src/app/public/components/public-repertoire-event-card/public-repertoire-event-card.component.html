<article class="event-card">
  <a class="poster" [routerLink]="locale.productionPath(slug())" [attr.aria-label]="i18n.t('repertoire.details') + ': ' + title()">
    <img [src]="image()" [alt]="title()" loading="lazy" />
  </a>

  <div class="event-content">
    <strong class="time">{{ display.time(event().startsAt) }}</strong>

    <div class="meta">
      <span>{{ display.productionType(production()?.type) }}</span>
      <span>{{ venue() }}</span>
      <em *ngIf="event().isPremiere">{{ 'production.premiere' | publicTranslate }}</em>
    </div>

    <h3><a [routerLink]="locale.productionPath(slug())">{{ title() }}</a></h3>
    <div class="credits" *ngIf="credits().length">
      <span *ngFor="let credit of credits()">
        {{ credit.label }}: <strong>{{ credit.name }}</strong>
      </span>
    </div>
  </div>

  <div class="actions">
    <a class="details" [routerLink]="locale.productionPath(slug())">
      <span aria-hidden="true">&#9432;</span>
      {{ 'common.learnMore' | publicTranslate }}
    </a>

    <a
      class="buy"
      *ngIf="sale().canPurchase; else saleStatus"
      [routerLink]="locale.ticketPath(eventId())"
      [attr.aria-label]="i18n.t('production.buyTickets') + ': ' + title()"
      [title]="'production.buyTickets' | publicTranslate"
    >
      <span class="ticket-icon" aria-hidden="true"></span>
    </a>

    <ng-template #saleStatus>
      <span class="sale-status" [attr.data-state]="sale().state">{{ sale().label }}</span>
    </ng-template>
  </div>
</article>
