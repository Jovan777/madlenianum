<section class="news-section" *ngIf="items().length" data-motion="up">
  <div class="section-top">
    <h2>{{ heading() || i18n.t('home.behindScenes') }}</h2>
    <div class="filters" role="tablist" [attr.aria-label]="i18n.t('news.title')">
      <button
        *ngFor="let filter of filters"
        type="button"
        role="tab"
        [class.active]="filter.value === activeFilter()"
        [attr.aria-selected]="filter.value === activeFilter()"
        (click)="activeFilter.set(filter.value)"
      >{{ filterLabel(filter.value) }}</button>
    </div>
  </div>

  <div class="news-grid" *ngIf="visibleItems().length; else emptyNews" data-motion-stagger>
    <article *ngFor="let item of visibleItems()" data-motion-item data-motion-card>
      <div class="meta">
        <span>{{ display.newsCategory(item.category) }}</span>
        <time *ngIf="item.publishedAt" [attr.datetime]="item.publishedAt">{{ display.dayMonth(item.publishedAt) }}</time>
      </div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.excerpt || item.subtitle }}</p>
      <a *ngIf="item.relatedProduction?.slug" [routerLink]="[locale.equivalentPath('/predstave', locale.current()), item.relatedProduction?.slug]">{{ i18n.t('news.relatedProduction') }}</a>
    </article>
  </div>

  <ng-template #emptyNews>
    <p class="news-empty">{{ i18n.t('home.noNews') }}</p>
  </ng-template>
</section>
