<section class="inquiry-form" [attr.aria-labelledby]="'rental-inquiry-'+space().id" data-motion="up">
  <div class="intro"><p class="eyebrow">{{ i18n.t('rental.inquiryEyebrow') }}</p><h2 [id]="'rental-inquiry-'+space().id">{{space().title}}</h2><p>{{ i18n.t('rental.inquiryIntro') }}</p></div>
  <div class="success" *ngIf="reference();else formBlock"><h3>{{ i18n.t('rental.received') }}</h3><p>{{ i18n.t('rental.reference') }} <strong>{{reference()}}</strong>.</p><p>{{ i18n.t('rental.notReserved') }}</p><p *ngIf="emailWarning()">{{ i18n.t('rental.emailWarning') }}</p><button type="button" (click)="resetSuccess()">{{ i18n.t('rental.newInquiry') }}</button></div>
  <ng-template #formBlock><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ i18n.t('rental.firstName') }} *<input formControlName="firstName" autocomplete="given-name" /></label><label>{{ i18n.t('rental.lastName') }} *<input formControlName="lastName" autocomplete="family-name" /></label><label>{{ i18n.t('rental.companyName') }}<input formControlName="companyName" autocomplete="organization" /></label><label>{{ i18n.t('forms.email') }} *<input type="email" formControlName="email" autocomplete="email" /></label><label>{{ i18n.t('rental.phone') }} *<input formControlName="phone" autocomplete="tel" /></label><label>{{ i18n.t('rental.desiredDate') }}<input type="date" formControlName="desiredDate" /></label><label>{{ i18n.t('rental.guestCount') }}<input type="number" min="1" formControlName="approximateGuestCount" /></label><label class="wide">{{ i18n.t('rental.note') }}<textarea rows="5" formControlName="note"></textarea></label><p class="error wide" *ngIf="error()">{{error()}}</p><button class="submit" type="submit" [disabled]="submitting()">{{ i18n.t(submitting() ? 'forms.sending' : 'rental.inquiry') }}</button></form></ng-template>
</section>
