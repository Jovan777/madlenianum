<div class="modal-backdrop" (click)="closed.emit()">
  <section class="preview-dialog" role="dialog" aria-modal="true" [attr.aria-label]="name" (click)="$event.stopPropagation()">
    <header>
      <div>
        <small>Media preview</small>
        <h2>{{ name }}</h2>
      </div>
      <button type="button" aria-label="Close preview" (click)="closed.emit()">&times;</button>
    </header>

    <div class="preview-stage">
      <img *ngIf="isImage; else documentState" [src]="resolvedUrl" [alt]="item.altText || item.alt || name" />
      <ng-template #documentState>
        <div class="document-state">
          <strong>PDF document</strong>
          <a [href]="resolvedUrl" target="_blank" rel="noopener">Open document</a>
        </div>
      </ng-template>
    </div>

    <dl>
      <div><dt>Original file</dt><dd>{{ item.originalName }}</dd></div>
      <div><dt>Type</dt><dd>{{ item.mimeType }}</dd></div>
      <div *ngIf="item.caption"><dt>Caption</dt><dd>{{ item.caption }}</dd></div>
      <div *ngIf="item.credit"><dt>Credit</dt><dd>{{ item.credit }}</dd></div>
    </dl>
  </section>
</div>
