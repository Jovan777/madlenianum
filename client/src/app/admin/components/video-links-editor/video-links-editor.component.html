<div class="editor-head"><div><h3>Video i trejler</h3><p>YouTube i Vimeo linkovi se cuvaju kao strukturirani podaci.</p></div><button type="button" (click)="add()">Dodaj video</button></div>
<p class="empty" *ngIf="!array.length">Nema dodatih video linkova.</p>
<div class="video-row" *ngFor="let group of groups();let index=index" [formGroup]="group">
  <header><strong>Video {{ index+1 }}</strong><div><button type="button" (click)="move(index,-1)" [disabled]="index===0">Gore</button><button type="button" (click)="move(index,1)" [disabled]="index===array.length-1">Dole</button><button type="button" class="danger" (click)="remove(index)">Ukloni</button></div></header>
  <div class="grid" *ngIf="language === 'sr'"><label>Provajder<select formControlName="provider"><option *ngFor="let option of providers" [value]="option.value">{{option.label}}</option></select></label><label>Naslov<input formControlName="title" /></label><label class="wide">URL<input type="url" formControlName="url" placeholder="https://youtube.com/..." /></label><label class="trailer"><input type="radio" name="mainTrailer" [checked]="group.get('isTrailer')?.value" (change)="setTrailer(index)" />Glavni trejler</label><app-media-picker class="wide" label="Slicica videa" mode="single" mediaKind="image" [value]="thumbnailValue(group)" (selectionChange)="updateThumbnail(group,$event)"/></div>
  <div class="grid" formGroupName="translations" *ngIf="language === 'en'"><ng-container formGroupName="en"><label class="wide">English title<input formControlName="title" /></label></ng-container></div>
  <small class="error" *ngIf="group.get('url')?.touched&&group.get('url')?.invalid">Unesite ispravan HTTP/HTTPS video URL.</small>
</div>
