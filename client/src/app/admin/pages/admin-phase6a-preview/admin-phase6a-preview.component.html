<main class="preview"><p *ngIf="loading()">Učitavanje pregleda...</p><p class="error" *ngIf="error()">{{error()}}</p><article *ngIf="item() as entry"><p class="eyebrow">Admin pregled · nije za indeksiranje</p><img *ngIf="image(entry)" [src]="image(entry)" [alt]="entry.title"/><div><h1>{{entry.title}}</h1><p *ngIf="shortDescription(entry)">{{shortDescription(entry)}}</p><div [innerHTML]="entry.description"></div></div></article></main>
