<article class="preview-page"><header class="preview-admin"><div><strong>Admin pregled sacuvane verzije</strong><span>Buduci datum objave se postuje na javnom API-ju.</span></div><a [routerLink]="['/admin/news',item()?.['id'],'edit']">Nazad na uredjivanje</a></header><p *ngIf="loading()">Ucitavanje...</p><p class="error" *ngIf="error()">{{error()}}</p><ng-container *ngIf="item() as article"><p class="eyebrow">{{article['category']}} / {{ $any(article['publishedAt']) | date:'dd.MM.yyyy.' }}</p><h1>{{article['title']}}</h1><h2>{{article['subtitle']}}</h2><p class="lead">{{article['excerpt']}}</p><img class="hero" *ngIf="image(article['image'])" [src]="image(article['image'])" [alt]="$any(article['title'])"/><section [innerHTML]="article['body']"></section><div class="gallery"><img *ngFor="let entry of array('galleryItems')" [src]="image(entry['media'])"/></div></ng-container></article>
