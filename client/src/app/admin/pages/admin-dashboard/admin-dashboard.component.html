<section class="studio-dashboard">
  <div class="dashboard-hero">
    <span>CMS</span>
    <h1>Studio</h1>
    <a routerLink="/admin/events">Dates</a>
  </div>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

  <div class="quick-grid" *ngIf="!isLoading()">
    <a *ngFor="let card of cards()" [routerLink]="card.route">
      <strong>{{ card.value }}</strong>
      <span>{{ card.label }}</span>
    </a>
  </div>

  <section class="quiet-panel" *ngIf="warnings() as warningMap">
    <article>
      <span>On sale</span>
      <strong>{{ warningMap['eventsOnSale'] || 0 }}</strong>
    </article>
    <article>
      <span>No map</span>
      <strong>{{ warningMap['eventsMissingSeatMap'] || 0 }}</strong>
    </article>
    <article>
      <span>No price</span>
      <strong>{{ warningMap['eventsMissingPricePlan'] || 0 }}</strong>
    </article>
  </section>

  <p class="loading" *ngIf="isLoading()">Loading...</p>
</section>
