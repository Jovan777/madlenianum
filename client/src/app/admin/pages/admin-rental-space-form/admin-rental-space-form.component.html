<div class="cms-form-page"><a class="back" routerLink="/admin/rental-spaces">Nazad na prostore</a><header class="cms-form-hero"><div><p>Zakup prostora</p><h1>{{id()?'Uredi prostor':'Novi prostor'}}</h1><span>Jasni kapaciteti, oprema, galerija i komercijalne informacije.</span></div></header><p class="cms-alert" *ngIf="error()">{{error()}}</p><p class="cms-loading" *ngIf="loading()">Učitavanje...</p><form *ngIf="!loading()" [formGroup]="form" class="cms-long-form"><section class="cms-panel"><header><div><span>1</span><h2>Osnovno</h2></div></header><div class="cms-grid"><label>Naziv *<input formControlName="title"/></label><label>Slug<input formControlName="slug"/></label><label class="wide">Kratak opis<textarea rows="3" formControlName="shortDescription"></textarea></label><label>Povezana scena<select formControlName="linkedVenue"><option value="">Bez povezane scene</option><option *ngFor="let venue of venues()" [value]="venue.id||venue._id">{{venue.title||venue.displayName}}</option></select></label></div><app-rich-text-editor formControlName="description"/></section><section class="cms-panel"><header><div><span>2</span><h2>Kapacitet i namena</h2></div></header><div class="cms-grid"><label>Sedeći kapacitet<input type="number" min="0" formControlName="seatedCapacity"/></label><label>Stojeći kapacitet<input type="number" min="0" formControlName="standingCapacity"/></label><label>Površina m²<input type="number" min="0" formControlName="areaSqm"/></label><app-tag-editor label="Pogodnosti" formControlName="amenities"/><app-tag-editor label="Tehnička oprema" formControlName="technicalEquipment"/><app-tag-editor label="Pogodno za tipove događaja" formControlName="suitableEventTypes"/></div></section><section class="cms-panel"><header><div><span>3</span><h2>Usluge i pristupačnost</h2></div></header><div class="cms-grid"><label class="wide">Pristupačnost<textarea formControlName="accessibilityInfo"></textarea></label><label>Garderobe<textarea formControlName="dressingRooms"></textarea></label><label>Catering<textarea formControlName="cateringInfo"></textarea></label><label>Bar<textarea formControlName="barInfo"></textarea></label><label>Internet<textarea formControlName="internetInfo"></textarea></label><label class="wide">AV podrška<textarea formControlName="avInfo"></textarea></label></div></section><section class="cms-panel"><header><div><span>4</span><h2>Mediji</h2></div></header><app-media-picker label="Hero slika" mode="single" mediaKind="image" [value]="heroImage()" (selectionChange)="updateMedia('heroImage',$event)"/><app-structured-gallery-editor formControlName="galleryItems"/><app-media-picker label="Plan prostora (PDF)" mode="single" mediaKind="document" [value]="floorPlan()" (selectionChange)="updateMedia('floorPlanPdf',$event)"/></section><section class="cms-panel"><header><div><span>5</span><h2>Objavljivanje</h2></div></header><div class="cms-grid"><label>Status<select formControlName="status"><option value="draft">Nacrt</option><option value="published">Objavljeno</option><option value="archived">Arhivirano</option></select></label><label>Datum objave<input type="datetime-local" formControlName="publishedAt"/></label><label>Redosled<input type="number" min="0" formControlName="displayOrder"/></label><label class="check"><input type="checkbox" formControlName="isFeatured"/>Izdvojeno</label></div></section><section class="cms-panel"><header><div><span>6</span><h2>SEO</h2></div></header><app-seo-fields [group]="seo"/></section><footer class="cms-action-bar"><a routerLink="/admin/rental-spaces">Odustani</a><button type="button" class="secondary" (click)="preview()" [disabled]="!id()">Pregled</button><button type="button" class="secondary" (click)="save('draft')">Sačuvaj nacrt</button><button type="button" class="primary" (click)="save('published')">{{saving()?'Čuvanje...':'Objavi'}}</button></footer></form></div>
