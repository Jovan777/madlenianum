<section class="cms-list-page"><header class="list-hero"><div><span>{{items().length}} strana</span><h1>Strane i sadrzaj</h1><p>O nama i Kontakt imaju namenske strukturirane editore.</p></div><a routerLink="/admin/pages/new">Nova jednostavna strana</a></header><form class="filters" (ngSubmit)="load()"><label>Pretraga<input [(ngModel)]="q" name="q" /></label><label>Status<select [(ngModel)]="status" name="status"><option value="">Svi statusi</option><option value="draft">Nacrt</option><option value="published">Objavljeno</option><option value="archived">Arhivirano</option></select></label><button>Primeni</button></form><p class="state" *ngIf="loading()">Ucitavanje...</p><p class="state error" *ngIf="error()">{{error()}} <button (click)="load()">Pokusaj ponovo</button></p><p class="state" *ngIf="!loading()&&!items().length">Nema strana.</p><div class="page-grid"><article *ngFor="let item of items()"><span>{{item.pageType}}</span><h2>{{item.title}}</h2><p>/{{item.slug}}</p><strong>{{statusLabel(item.status)}}</strong><div><a [routerLink]="preview(item)">Pregled</a><a [routerLink]="editor(item)">Uredi</a><button (click)="archive(item)" [disabled]="item.status==='archived'">Arhiviraj</button></div></article></div></section>
